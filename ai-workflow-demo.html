<!doctype html>
<html lang="ru">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI workflow demo</title>
<style>html,body{margin:0;background:#070b16;color:#f7f8ff;font-family:Arial,sans-serif}canvas{width:100vw;height:auto;display:block}#hint{position:fixed;inset:0;display:grid;place-items:center;background:#070b16;color:#bdeeff;font:600 22px Arial;letter-spacing:.04em;z-index:2}</style>
<canvas id="scene" width="1920" height="1080"></canvas><div id="hint">Готовим AI workflow demo…</div>
<script>
const canvas=document.querySelector('#scene'), ctx=canvas.getContext('2d');
const W=1920,H=1080, hint=document.querySelector('#hint');
const C={bg:'#070b16',panel:'#111a36',panel2:'#0d142b',text:'#f7f8ff',muted:'#96a5c8',line:'rgba(166,188,255,.18)',blue:'#5a7dff',cyan:'#49dbff',violet:'#a875ff',lime:'#b6ff6d',orange:'#ffb76b'};
let start=0;
function lerp(a,b,t){return a+(b-a)*t} function clamp(x){return Math.max(0,Math.min(1,x))}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2} function inout(t,a,b){return ease(clamp((t-a)/(b-a)))}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function txt(s,x,y,size,color=C.text,weight=500,align='left'){ctx.fillStyle=color;ctx.font=`${weight} ${size}px Arial`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function mono(s,x,y,size,color=C.text,weight=500){ctx.fillStyle=color;ctx.font=`${weight} ${size}px Menlo, Monaco, monospace`;ctx.textAlign='left';ctx.fillText(s,x,y)}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function glow(x,y,r,color,a=.22){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color.replace(')',`,`+a+')').replace('rgb','rgba'));g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function dot(x,y,color,rad=5){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill()}
function header(label, sub, sceneN){txt('FBS / AI DELIVERY',72,76,18,C.cyan,700);txt(label,72,115,42,C.text,700);txt(sub,72,151,18,C.muted,500);txt(('0'+sceneN).slice(-2)+' / 04',1848,76,17,C.muted,700,'right');line(72,185,1848,185,C.line)}
function cursor(x,y,click=0){ctx.save();ctx.translate(x,y);ctx.fillStyle='#fff';ctx.strokeStyle='#0a1023';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,43);ctx.lineTo(11,32);ctx.lineTo(23,55);ctx.lineTo(33,50);ctx.lineTo(21,27);ctx.lineTo(41,25);ctx.closePath();ctx.fill();ctx.stroke();if(click){ctx.strokeStyle=`rgba(73,219,255,${click})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(10,20,33*(1-click),0,Math.PI*2);ctx.stroke()}ctx.restore()}
function sceneBase(t){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(90,125,255,.045)';for(let x=0;x<W;x+=56)line(x,0,x,H,'rgba(110,140,255,.045)');for(let y=0;y<H;y+=56)line(0,y,W,y,'rgba(110,140,255,.045)');glow(1510,230,500,'rgb(90,125,255)',.18);glow(220,870,410,'rgb(168,117,255)',.12);}
function codeScene(t){sceneBase(t);header('Задача → готовый change','Cursor держит контекст репозитория и правит только нужный участок.',1);let a=inout(t,0,.8);ctx.globalAlpha=a;rr(72,230,1776,680,20,'rgba(12,19,42,.94)',C.line);rr(72,230,1776,62,20,'rgba(19,29,61,.92)');ctx.fillStyle='rgba(19,29,61,.92)';ctx.fillRect(72,270,1776,22);dot(110,261,'#ff7474',7);dot(134,261,C.orange,7);dot(158,261,C.lime,7);mono('payments-service / src / refund.ts',202,268,18,'#c8d6ff',600);rr(100,320,368,546,12,'rgba(9,15,33,.85)',C.line);mono('EXPLORER',126,355,13,C.muted,700);[['▾  payments-service',390],['   ▾  src',432],['      refund.ts',474],['      limits.ts',516],['   tests',558],['      refund.spec.ts',600]].forEach((v,i)=>mono(v[0],126,v[1],17,i===2?C.cyan:'#afbcdb',i===2?700:500));line(500,320,500,866,C.line);mono('refund.ts',536,355,16,C.text,700);let rows=['export async function approveRefund(request) {','  const eligibility = await checkEligibility(request);','  if (!eligibility.allowed) {','    return deny(eligibility.reason);','  }','','  return issueRefund({','    amount: request.amount,','    idempotencyKey: request.id,','  });','}'];rows.forEach((s,i)=>{let y=405+i*38;mono(String(i+1).padStart(2,'0'),536,y,15,'#526188');mono(s,590,y,19,i===6||i===9?C.cyan:'#e0e7ff',500)});
rr(1250,338,530,380,14,'rgba(16,28,59,.96)','rgba(73,219,255,.35)');txt('CURSOR / PLAN',1280,378,15,C.cyan,700);txt('Добавлю проверку лимита',1280,424,24,C.text,700);txt('перед созданием refund.',1280,456,24,C.text,700);txt('• scope: refund.ts + tests',1280,508,17,C.muted);txt('• policy: no production writes',1280,544,17,C.muted);txt('• proposed change is reviewable',1280,580,17,C.muted);let p=inout(t,1.1,3.9);if(p){ctx.globalAlpha=p;rr(1218,742,562,86,12,'rgba(73,219,255,.10)','rgba(73,219,255,.5)');mono('✓  2 files changed  ·  18 lines  ·  ready for test',1248,794,17,C.cyan,700)}ctx.globalAlpha=1;cursor(1500+Math.sin(t)*12,470,p>.8?1:0)}
function terminalScene(t){sceneBase(t);header('Проверяем change в sandbox','Codex собирает доказательства: тесты, diff и понятный summary.',2);rr(160,250,1600,610,20,'rgba(7,12,27,.95)','rgba(125,150,255,.28)');rr(160,250,1600,58,20,'rgba(20,30,59,.96)');ctx.fillStyle='rgba(20,30,59,.96)';ctx.fillRect(160,280,1600,28);dot(198,279,'#ff7474',7);dot(222,279,C.orange,7);dot(246,279,C.lime,7);mono('codex  •  sandbox / payments-service',292,286,17,'#c9d8ff',600);let lines=[['$ codex run "add refund limit check and verify"',C.cyan],['› Inspecting refund flow…',C.muted],['› Updating src/refund.ts',C.text],['› Updating tests/refund.spec.ts',C.text],['$ pnpm test refund',C.cyan],[' PASS  refund.spec.ts',C.lime],['  ✓ rejects amount above account limit',C.text],['  ✓ preserves idempotency key',C.text],['$ git diff --check',C.cyan],['✓ no whitespace errors',C.lime]];lines.forEach((z,i)=>{let q=inout(t,.25+i*.28,.45+i*.28);ctx.globalAlpha=q;mono(z[0],216,370+i*44,21,z[1],z[1]===C.lime?700:500);ctx.globalAlpha=1});let done=inout(t,3.6,4.4);ctx.globalAlpha=done;rr(1115,660,530,142,14,'rgba(182,255,109,.08)','rgba(182,255,109,.48)');txt('READY FOR REVIEW',1148,704,14,C.lime,700);txt('2 files · 2 tests passed',1148,746,23,C.text,700);txt('Evidence attached to the task',1148,777,16,C.muted);ctx.globalAlpha=1;cursor(780,610,0)}
function mcpScene(t){sceneBase(t);header('MCP превращает вывод в действие','Единый контекст, но каждое действие — в scope и с audit trail.',3);let nodes=[{x:120,y:375,w:280,h:168,title:'CODEX',sub:'evidence + summary',col:C.violet},{x:620,y:375,w:350,h:168,title:'MCP GATEWAY',sub:'policy · identity · audit',col:C.cyan},{x:1210,y:265,w:440,h:148,title:'JIRA',sub:'create ticket / link evidence',col:C.orange},{x:1210,y:555,w:440,h:148,title:'GCP',sub:'create preview / read status',col:C.lime}];line(400,459,620,459,'rgba(73,219,255,.6)',3);line(970,459,1090,339,'rgba(73,219,255,.6)',3);line(970,459,1090,629,'rgba(73,219,255,.6)',3);nodes.forEach((n,i)=>{let a=inout(t,.15+i*.25,.65+i*.25);ctx.globalAlpha=a;glow(n.x+n.w/2,n.y+n.h/2,170,n.col,.12);rr(n.x,n.y,n.w,n.h,18,'rgba(15,25,53,.94)',n.col+'');txt(n.title,n.x+28,n.y+53,24,n.col,700);txt(n.sub,n.x+28,n.y+91,17,C.text,600);ctx.globalAlpha=1});let p=(t*1.7)%1;dot(400+220*p,459,C.cyan,7);dot(970+120*p,459-120*p,C.cyan,7);dot(970+120*p,459+170*p,C.cyan,7);let a=inout(t,2.6,3.4);ctx.globalAlpha=a;rr(620,600,350,130,14,'rgba(73,219,255,.09)','rgba(73,219,255,.45)');mono('allow: jira.createIssue',645,642,17,C.cyan,700);mono('scope: AI-201 / preview only',645,676,15,'#d8e5ff');mono('audit: 4d2f…98a',645,707,15,C.muted);ctx.globalAlpha=1;cursor(1320,370,a)}
function resultScene(t){sceneBase(t);header('Результат — видим в рабочем контуре','AI ускоряет рутину, а команда сохраняет контроль над change.',4);let a=inout(t,0,.7);ctx.globalAlpha=a;rr(95,245,865,590,20,'rgba(13,22,48,.95)',C.line);txt('JIRA / DELIVERY BOARD',132,292,17,C.cyan,700);rr(132,328,790,124,14,'rgba(22,35,71,.88)','rgba(255,183,107,.42)');mono('AI-347',160,365,16,C.orange,700);txt('Add refund limit validation',160,407,25,C.text,700);txt('Ready for review  •  Evidence attached',160,434,16,C.muted);rr(132,486,790,124,14,'rgba(22,35,71,.88)','rgba(182,255,109,.38)');mono('DEPLOY-142',160,523,16,C.lime,700);txt('Preview environment created',160,565,25,C.text,700);txt('payments-pr-347  •  expires in 24h',160,592,16,C.muted);rr(132,646,790,140,14,'rgba(73,219,255,.08)','rgba(73,219,255,.38)');txt('HUMAN CHECKPOINT',160,687,15,C.cyan,700);txt('Engineer reviews diff → approves release',160,730,21,C.text,700);txt('Every tool call is linked to the ticket and audit event.',160,760,15,C.muted);
rr(1040,245,780,590,20,'rgba(13,22,48,.95)',C.line);txt('GCP / PREVIEW STATUS',1080,292,17,C.cyan,700);glow(1430,505,240,'rgb(73,219,255)',.15);ctx.strokeStyle='rgba(73,219,255,.45)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(1430,500,130,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(1430,500,85,0,Math.PI*2);ctx.stroke();dot(1430,500,C.lime,18);txt('healthy',1430,560,25,C.lime,700,'center');[['Cloud Run','preview revision active'],['Cloud Logging','audit event received'],['Policy','scope verified']].forEach((z,i)=>{rr(1090,635+i*52,680,40,9,'rgba(23,35,71,.8)');dot(1120,655+i*52,C.lime,5);txt(z[0],1140,662+i*52,16,C.text,700);txt(z[1],1738,662+i*52,15,C.muted,500,'right')});ctx.globalAlpha=1;let b=inout(t,3.0,3.8);ctx.globalAlpha=b;txt('AI tools in the daily flow — with guardrails.',960,965,30,C.text,700,'center');txt('Cursor · Codex · MCP · Jira · GCP',960,1005,18,C.cyan,600,'center');ctx.globalAlpha=1;cursor(650,732,b)}
function draw(now){let t=(now-start)/1000; if(t<5.4)codeScene(t);else if(t<10.8)terminalScene(t-5.4);else if(t<16.4)mcpScene(t-10.8);else resultScene(t-16.4); if(t<23.5)requestAnimationFrame(draw)}
async function record(){hint.remove();start=performance.now();let stream=canvas.captureStream(30);let mime=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));let rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000});let chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{let ext=mime.includes('mp4')?'mp4':'webm',url=URL.createObjectURL(new Blob(chunks,{type:mime}));let a=document.createElement('a');a.href=url;a.download='ai-daily-workflow-demo.'+ext;a.click();document.title='DONE:'+ext};rec.start(400);requestAnimationFrame(draw);setTimeout(()=>rec.stop(),24000)}
record();
</script>
